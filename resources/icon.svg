<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Webcam body -->
  <circle cx="64" cy="58" r="42" fill="#3a3a3a" stroke="#555" stroke-width="2"/>
  <!-- Outer lens ring -->
  <circle cx="64" cy="58" r="28" fill="#222" stroke="#666" stroke-width="1.5"/>
  <!-- Lens glass -->
  <circle cx="64" cy="58" r="18" fill="#1a3a5c"/>
  <!-- Lens reflection -->
  <circle cx="57" cy="51" r="6" fill="#3a6a9c" opacity="0.6"/>
  <circle cx="54" cy="48" r="2.5" fill="#8ab4e0" opacity="0.7"/>
  <!-- Recording indicator LED -->
  <circle cx="90" cy="32" r="4" fill="#e04040"/>
  <circle cx="90" cy="32" r="2.5" fill="#ff6666" opacity="0.8"/>
  <!-- Base / stand -->
  <rect x="44" y="98" width="40" height="8" rx="3" fill="#3a3a3a"/>
  <rect x="56" y="94" width="16" height="8" rx="2" fill="#444"/>
</svg>
